<!-- Template untuk <app-modal> (js/components/app-modal.js) -->
<template id="tpl-modal">
  <transition name="fade">
    <div class="modal-backdrop" v-if="show" @click.self="tutup">
      <div class="modal" :class="'modal-' + ukuran" ref="kotak" tabindex="-1"
           role="dialog" aria-modal="true" :aria-label="title">
        <div class="modal-head">
          <h2>{{ title }}</h2>
          <button type="button" class="close-btn" @click="tutup" aria-label="Tutup">&times;</button>
        </div>
        <div class="modal-body">
          <slot></slot>
        </div>
        <div class="modal-foot" v-if="$slots.footer">
          <slot name="footer"></slot>
        </div>
      </div>
    </div>
  </transition>
</template>
